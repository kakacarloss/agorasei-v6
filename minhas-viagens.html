
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minhas Viagens</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.logo{
width:220px;
display:block;
margin:auto;
opacity:.15;
}

.card{
background:white;
padding:15px;
margin-top:15px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
text-align:center;
}

</style>

</head>
<body>

<img src="agorasei-1.png.webp" class="logo">

<h2>Minhas Viagens</h2>

<div id="lista"></div>

<script>

const SUPABASE_URL =
'https://pwjcoprqjdwawjsgsyaj.supabase.co'

const SUPABASE_KEY =
'SUA_CHAVE_COMPLETA'

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
)

async function carregar(){

const {
data:{user}
}
=
await supabaseClient.auth.getUser()

const { data, error } =
await supabaseClient
.from('viagens')
.select('*')
.eq('usuario_id',user.id)

const lista =
document.getElementById('lista')

lista.innerHTML=''

data.forEach(v=>{

lista.innerHTML += `
<div class="card">

<b>Cidade:</b>
${v["CIDADE"] || ""}

<br><br>

<b>Placa:</b>
${v["PLACA DO CARRO"] || ""}

<br><br>

<b>Status:</b>
${v["STATUS"] || ""}

</div>
`

})

}

carregar()

</script>

</body>
</html>
