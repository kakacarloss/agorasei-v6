<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Viagem</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
max-width:500px;
margin:auto;
}

.logo{
width:220px;
display:block;
margin:auto;
opacity:.15;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#0066cc;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<img src="agorasei-1.png.webp" class="logo">

<h2>Nova Viagem</h2>

<input
id="cidade"
placeholder="Cidade">

<input
id="placa"
placeholder="Placa do carro">

<input
id="km"
type="number"
placeholder="KM Inicial">

<button>
INICIAR VIAGEM
</button>

</div>

</body>
</html>
