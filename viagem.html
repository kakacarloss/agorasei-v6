<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova Viagem</title>

<style>

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
padding:15px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
max-width:500px;
margin:auto;
}

.logo{
width:220px;
display:block;
margin:auto;
opacity:.15;
}

input{
width:100%;
padding:15px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;
font-size:16px;
}

button{
width:100%;
padding:15px;
margin-top:15px;
font-size:18px;
border:none;
border-radius:10px;
background:#0066cc;
color:white;
cursor:pointer;
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="card">

<img src="agorasei-1.png.webp" class="logo">

<h2>Nova Viagem</h2>

<input
id="cidade"
placeholder="Cidade">

<input
id="placa"
placeholder="Placa do carro">

<input
id="km"
type="number"
placeholder="KM Inicial">

<button onclick="iniciarViagem()">
INICIAR VIAGEM
</button>

</div>
<script>

const SUPABASE_URL =
'https://pwjcoprqjdwawjsgsyaj.supabase.co'

const SUPABASE_KEY =
'sb_publishable_il1WqAWKnYUOjrdazzgZMQ_Y-EmxHHQ'

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
)

async function iniciarViagem(){

const cidade =
document.getElementById('cidade').value

const placa =
document.getElementById('placa').value

const km =
document.getElementById('km').value

const {
data:{user}
}
=
await supabaseClient.auth.getUser()

if(!user){

alert('Faça login novamente')
return

}

const { error } =
await supabaseClient
.from('viagens')
.insert([{

"CIDADE": cidade,
"PLACA DO CARRO": placa,
"KM INICIAL": Number(km),
"STATUS": "EM ANDAMENTO",
usuario_id: user.id

}])

if(error){

alert(error.message)
return

}

alert('Viagem criada com sucesso!')

window.location.href =
'dashboard.html'

}

</script>
</body>
</html>
